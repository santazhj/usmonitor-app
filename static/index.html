<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#09090b" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" />
    <link rel="stylesheet" href="/static/styles.css?v=20260612-usmonitor-terminal" />
    <title>US Monitor</title>
  </head>
  <body class="market-page terminal-page">
    <main class="shell terminal-shell">
      <header class="terminal-topbar">
        <a class="terminal-brand" href="/" aria-label="US Monitor">
          <img src="/icon.svg" alt="" />
          <span>
            <strong>US Monitor</strong>
            <small data-i18n="brand.subtitle">AI 产业链情报终端</small>
          </span>
        </a>
        <nav class="terminal-nav" aria-label="Primary">
          <a class="quiet-link active" href="#dashboard" data-i18n="nav.dashboard">看板</a>
          <a class="quiet-link" href="#alerts" data-i18n="nav.alerts">情报</a>
          <a class="quiet-link" href="/login" data-i18n="nav.account">账户</a>
          <a id="adminLink" class="quiet-link hidden" href="/admin">Admin</a>
          <button id="languageToggle" class="terminal-button ghost" type="button">EN</button>
          <button id="logoutBtn" class="terminal-button ghost hidden" type="button" data-i18n="nav.logout">
            退出
          </button>
        </nav>
      </header>

      <section id="dashboard" class="terminal-hero">
        <div>
          <p class="eyebrow" data-i18n="hero.eyebrow">AI Infrastructure</p>
          <h1 data-i18n="hero.title">美股 AI 产业链监控</h1>
          <p data-i18n="hero.lede">
            按云资本开支、算力网络、晶圆制造、存储、封装、光互连、电力冷却和软件数据分层跟踪核心标的。
          </p>
        </div>
        <div class="terminal-status-card">
          <span data-i18n="status.label">数据状态</span>
          <strong id="dataStatus">Loading</strong>
          <small id="lastUpdated">--</small>
        </div>
      </section>

      <section id="dashboardMetrics" class="terminal-kpis" aria-label="Dashboard metrics"></section>

      <section class="terminal-layout">
        <aside class="terminal-sidebar" aria-label="Filters">
          <section class="terminal-card">
            <div class="terminal-card-head">
              <span data-i18n="filters.title">产业链分组</span>
              <button id="clearFiltersBtn" class="icon-text-button" type="button" data-i18n="filters.clear">
                清空
              </button>
            </div>
            <div id="categoryTabs" class="terminal-category-list"></div>
          </section>

          <section class="terminal-card">
            <div class="terminal-card-head">
              <span data-i18n="sources.title">数据源</span>
              <span id="refreshLabel" class="muted">--</span>
            </div>
            <div id="sourceStatus" class="terminal-source-list"></div>
          </section>
        </aside>

        <section class="terminal-main">
          <div class="terminal-toolbar">
            <label class="terminal-search" for="dashboardSearch">
              <span aria-hidden="true">⌕</span>
              <input
                id="dashboardSearch"
                type="search"
                autocomplete="off"
                data-i18n-placeholder="search.placeholder"
                placeholder="搜索 ticker、公司、AI 角色"
              />
            </label>
            <select id="rowQualityFilter" class="terminal-select" aria-label="Data quality">
              <option value="all" data-i18n="quality.all">全部</option>
              <option value="live" data-i18n="quality.live">有行情</option>
              <option value="missing" data-i18n="quality.missing">缺行情</option>
            </select>
          </div>

          <section class="terminal-table-card" aria-label="AI stock watchlist">
            <div class="terminal-table-title">
              <div>
                <span class="eyebrow">Watchlist Matrix</span>
                <h2 data-i18n="table.title">产业链标的矩阵</h2>
              </div>
              <p id="tableStatus">--</p>
            </div>
            <div class="terminal-table-scroll">
              <div class="terminal-table" role="table">
                <div class="terminal-table-row terminal-table-head" role="row">
                  <button class="table-sort sticky-col" data-sort="ticker" type="button" data-i18n="table.ticker">标的</button>
                  <button class="table-sort" data-sort="price" type="button" data-i18n="table.price">最新价</button>
                  <button class="table-sort" data-sort="change_percent" type="button" data-i18n="table.change">% 涨跌</button>
                  <button class="table-sort" data-sort="dollar_volume" type="button" data-i18n="table.dollarVolume">成交额</button>
                  <button class="table-sort" data-sort="market_cap" type="button" data-i18n="table.marketCap">市值</button>
                  <button class="table-sort" data-sort="pe_ratio" type="button" data-i18n="table.pe">PE</button>
                  <button class="table-sort" data-sort="category_label" type="button" data-i18n="table.layer">分层</button>
                  <span data-i18n="table.role">AI 角色</span>
                  <span data-i18n="table.source">数据</span>
                </div>
                <div id="dashboardRows" class="terminal-table-body"></div>
              </div>
            </div>
          </section>
        </section>

        <aside id="alerts" class="terminal-alerts">
          <section class="terminal-card">
            <div class="terminal-card-head">
              <span data-i18n="alerts.title">最新情报</span>
              <div class="feed-filter" role="group" aria-label="Alert filter">
                <button class="feed-filter-btn active" data-feed-filter="all" type="button" data-i18n="alerts.all">全部</button>
                <button class="feed-filter-btn" data-feed-filter="unread" type="button" data-i18n="alerts.unread">未读</button>
                <button class="feed-filter-btn" data-feed-filter="saved" type="button" data-i18n="alerts.saved">收藏</button>
              </div>
            </div>
            <div id="feedBox" class="terminal-feed-list">
              <p class="empty" data-i18n="alerts.loading">正在加载情报...</p>
            </div>
          </section>
        </aside>
      </section>
    </main>

    <aside id="tickerDrawer" class="ticker-drawer hidden" aria-hidden="true">
      <div class="drawer-backdrop" data-drawer-close></div>
      <section class="drawer-panel terminal-drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
        <button id="drawerClose" class="icon-button" type="button" aria-label="Close">×</button>
        <div id="drawerBody"></div>
      </section>
    </aside>

    <script src="/static/app.js?v=20260612-usmonitor-terminal" type="module"></script>
  </body>
</html>
